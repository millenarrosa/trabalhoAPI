<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de Produtos</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        form { margin-bottom: 30px; }
        div { margin-bottom: 10px; }
        table { border-collapse: collapse; width: 100%; max-width: 700px; }
        th, td { border: 1px solid #ccc; padding: 10px; text-align: left; }
        .btn-delete { background-color: #ff4d4d; color: white; border: none; padding: 5px 10px; cursor: pointer; border-radius: 3px; }
        .btn-delete:hover { background-color: #cc0000; }
    </style>
</head>
<body>
    <h1>Cadastro de Produtos</h1>
    
    <form id="produtoForm">
        <div>
            <label>Nome do Produto: </label>
            <input type="text" id="nome" required>
        </div>
        <div>
            <label>Preço: </label>
            <input type="number" step="0.01" id="preco" required>
        </div>
        <div>
            <label>Quantidade: </label>
            <input type="number" id="quantidade" required>
        </div>
        <button type="submit">Salvar Produto</button>
    </form>

    <h2>Lista de Produtos</h2>
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Nome</th>
                <th>Preço</th>
                <th>Quantidade</th>
                <th>Ações</th> <!-- Nova coluna adicionada -->
            </tr>
        </thead>
        <tbody id="tabelaCorpo">
            <tr><td colspan="5" style="text-align: center;">Nenhum produto cadastrado</td></tr>
        </tbody>
    </table>

    <script>
        const API_URL = 'http://localhost:9000/api/produtos';

        // 1. Faz o GET no Gateway para listar
        async function buscarProdutos() {
            try {
                const resposta = await fetch(API_URL);
                if (resposta.ok) {
                    const produtos = await resposta.json();
                    const tbody = document.getElementById('tabelaCorpo');
                    
                    if (produtos.length === 0) {
                        tbody.innerHTML = '<tr><td colspan="5" style="text-align: center;">Nenhum produto cadastrado</td></tr>';
                        return;
                    }
                    
                    tbody.innerHTML = ''; 
                    produtos.forEach(produto => {
                        tbody.innerHTML += `
                            <tr>
                                <td>${produto.id}</td>
                                <td>${produto.nome}</td>
                                <td>R$ ${produto.preco}</td>
                                <td>${produto.quantidade}</td>
                                <td>
                                    <button class="btn-delete" onclick="deletarProduto(${produto.id})">Excluir</button>
                                </td>
                            </tr>
                        `;
                    });
                }
            } catch (erro) {
                console.error("Erro ao buscar:", erro);
            }
        }

        // 2. Faz o POST no Gateway para salvar
        document.getElementById('produtoForm').addEventListener('submit', async (e) => {
            e.preventDefault(); 
            
            const novo = {
                nome: document.getElementById('nome').value,
                preco: parseFloat(document.getElementById('preco').value),
                quantidade: parseInt(document.getElementById('quantidade').value)
            };

            try {
                const resposta = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(novo)
                });

                if (resposta.ok) {
                    alert("Produto salvo com sucesso!");
                    document.getElementById('produtoForm').reset(); 
                    buscarProdutos(); 
                }
            } catch (erro) {
                console.error("Erro ao salvar:", erro);
            }
        });

        // 3. Nova função: Faz o DELETE no Gateway para excluir
        async function deletarProduto(id) {
            const confirmar = confirm("Tem certeza que deseja excluir este produto?");
            if (!confirmar) return;

            try {
                // Adiciona o ID no final da URL (ex: http://localhost:9000/api/produtos/1)
                const resposta = await fetch(`${API_URL}/${id}`, {
                    method: 'DELETE'
                });

                if (resposta.ok) {
                    buscarProdutos(); // Atualiza a tabela imediatamente após excluir
                } else {
                    alert("Erro ao excluir o produto.");
                }
            } catch (erro) {
                console.error("Erro ao deletar:", erro);
            }
        }

        // Carrega os dados assim que a tela abre
        buscarProdutos();
    </script>
</body>
</html>
